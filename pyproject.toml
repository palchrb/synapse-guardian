[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "family-guard"
version = "0.1.0"
description = "Synapse module restricting which homeservers/users protected local accounts can federate with"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "palchrb" }]
dependencies = [
    "matrix-common>=1.3.0",
]

[project.optional-dependencies]
synapse = ["matrix-synapse>=1.133"]
dev = [
    "matrix-synapse==1.161.0",
    "parameterized>=0.9.0",
    "idna>=3.3",
    "pytest>=7",
    "pyflakes",
    "pyyaml",
]
bot = ["maubot>=0.6"]

[tool.setuptools]
packages = ["family_guard"]

[tool.pytest.ini_options]
testpaths = ["family_guard_tests"]
addopts = "-q -p no:maubot"  # maubot (optional bot extra) registers a pytest plugin needing pytest-asyncio
